<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="application-name" content="CP Năng Lượng" />
  <meta name="apple-mobile-web-app-title" content="CP Năng Lượng" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0c14" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>CP Năng Lượng</title>
  <style>
    body{margin:0;background:#05060a;color:#e2e8f0;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .box{text-align:center;padding:24px}
    .spin{width:36px;height:36px;border:3px solid rgba(103,232,249,.25);border-top-color:#67e8f9;border-radius:50%;margin:0 auto 12px;animation:s .8s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="box"><div class="spin"></div><div id="msg">Đang tải CP Năng Lượng…</div></div>
  <script>
  (async function () {
    function b64ToBytes(b64) {
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }
    async function gunzip(bytes) {
      if (typeof DecompressionStream !== 'undefined') {
        var ds = new DecompressionStream('gzip');
        var stream = new Blob([bytes]).stream().pipeThrough(ds);
        var ab = await new Response(stream).arrayBuffer();
        return new TextDecoder('utf-8').decode(ab);
      }
      throw new Error('Trình duyệt không hỗ trợ giải nén gzip');
    }
    var n = 3;
    var parts = [];
    for (var i = 0; i < n; i++) {
      var r = await fetch('b64_' + i + '.txt');
      if (!r.ok) throw new Error('b64_' + i + ' HTTP ' + r.status);
      parts.push(await r.text());
    }
    document.getElementById('msg').textContent = 'Đang giải nén…';
    var bytes = b64ToBytes(parts.join('').replace(/\s+/g, ''));
    var html = await gunzip(bytes);
    document.open();
    document.write(html);
    document.close();
  })().catch(function (e) {
    document.getElementById('msg').innerHTML = 'Lỗi: ' + e + '<br><small>Thử Chrome/Safari mới hơn hoặc tải lại.</small>';
  });
  </script>
</body>
</html>
